name: Verify Deploy Live

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Poll version.txt until live
    runs-on: ubuntu-latest
    steps:
      # Full history so a live SHA that is a descendant of EXPECTED_SHA can be recognised.
      # 10/30 race: pushes 5e38488 and 9445e82 each opened a false "DEPLOY NOT LIVE" issue
      # because main moved on, so the live SHA was a newer commit than the one being verified.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for Netlify deploy and verify version.txt
        env:
          SITE_URL: https://trailbuiltoverland.com
          EXPECTED_SHA: ${{ github.sha }}
          MAX_WAIT: 1200   # 20 minutes
          INTERVAL: 60
        run: |
          echo "Polling ${SITE_URL}/version.txt for SHA ${EXPECTED_SHA}"
          elapsed=0
          while [ $elapsed -lt $MAX_WAIT ]; do
            live_sha=$(curl -sf --max-time 10 "${SITE_URL}/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            echo "  [${elapsed}s] live=${live_sha:-<empty>}"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "✅ Deploy confirmed live at ${elapsed}s"
              exit 0
            fi
            # Live is a later commit on main: the expected deploy is superseded, not missing.
            # An older, unknown or unreadable live SHA never passes.
            if echo "$live_sha" | grep -Eq '^[0-9a-f]{40}$'; then
              git fetch --quiet origin main || true
              if git merge-base --is-ancestor "$EXPECTED_SHA" "$live_sha" 2>/dev/null \
                 && git merge-base --is-ancestor "$live_sha" origin/main 2>/dev/null; then
                echo "✅ Live ${live_sha} is a descendant of ${EXPECTED_SHA} on main (${elapsed}s)"
                exit 0
              fi
            fi
            sleep $INTERVAL
            elapsed=$((elapsed + INTERVAL))
          done
          echo "❌ Deploy NOT live after ${MAX_WAIT}s (last seen: ${live_sha:-<empty>})"
          exit 1

      - name: Open issue on timeout
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `DEPLOY NOT LIVE: ${context.sha.slice(0,10)}`,
              body: [
                `## Netlify deploy did not go live within 20 minutes`,
                ``,
                `- **Commit:** ${context.sha}`,
                `- **Branch:** ${context.ref}`,
                `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Check the Netlify dashboard for build errors: https://app.netlify.com`,
              ].join('\n'),
              labels: ['deploy-failure'],
            });
