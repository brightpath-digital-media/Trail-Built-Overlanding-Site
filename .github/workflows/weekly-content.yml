name: Weekly AI Content + Deploy

on:
  # Fallback only: a Manus authoring task publishes Monday mornings (~7:00 AM PT)
  # with the standard "chore: auto-publish" commit. The idempotency guard makes
  # these runs green no-ops after that publish, and generates only if it did not land.
  schedule:
    - cron: '0 17 * * 1'
    - cron: '0 20 * * 1'
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      topic:
        description: 'Article topic (leave blank to auto-pick from queue)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — generate article but do NOT commit or deploy'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 1b. Idempotency Guard ────────────────────────────────────────────────
      - name: Check if already published today
        id: check_published
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Checking for commits since 00:00 UTC today ($TODAY) with auto-publish pattern..."
          
          # Find commits today matching the auto-publish message pattern
          PUBLISHED_TODAY=$(git log --since="${TODAY}T00:00:00Z" --grep="chore: auto-publish" --format="%H")
          
          if [ -n "$PUBLISHED_TODAY" ]; then
            echo "Already published today - skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "No auto-publish commit found today - proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit early if already published
        if: steps.check_published.outputs.skip == 'true'
        run: |
          echo "Idempotency guard triggered: A publish commit was already found today."
          echo "Ending job successfully without running generation."
          exit 0

      # ── 2. Setup runtimes ────────────────────────────────────────────────────
      - name: Set up Node.js
        id: setup_node
        if: steps.check_published.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        id: setup_python
        if: steps.check_published.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        id: install_python_dependencies
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          pip install -r requirements.txt requests python-dateutil 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/install-python-dependencies.log"

      # ── 3. Verify tests before generating (no secrets passed) ───────────────
      - name: Verify topic pool and overwrite guard
        id: verify_topic_pool
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          {
            node scripts/verify-topic-pool.js
            node scripts/test-overwrite-guard.js
            python3 tools/test_normalize_article_chrome.py
          } 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/verify-topic-pool-and-overwrite-guard.log"

      - name: Verify Creators API partner tag
        id: verify_creators_api_partner_tag
        if: steps.check_published.outputs.skip != 'true'
        env:
          CREATORS_API_PARTNER_TAG: ${{ secrets.CREATORS_API_PARTNER_TAG || secrets.PAAPI_PARTNER_TAG }}
        run: |
          if [ -z "$CREATORS_API_PARTNER_TAG" ]; then
            echo "::error::Creators API partner tag is not configured. Set PAAPI_PARTNER_TAG or CREATORS_API_PARTNER_TAG as a repository secret."
            exit 1
          fi
          echo "Creators API partner tag is configured."

      # ── 3b. Build runtime-verified product pool ───────────────────────────────
      - name: Build runtime-verified product pool
        id: build_verified_product_pool
        if: steps.check_published.outputs.skip != 'true'
        env:
          CREATORS_API_CLIENT_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_API_CLIENT_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_API_PARTNER_TAG: ${{ secrets.CREATORS_API_PARTNER_TAG || secrets.PAAPI_PARTNER_TAG }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          node scripts/build-verified-pool.mjs --verify 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/build-verified-product-pool.log"

      # ── 4. Generate article ──────────────────────────────────────────────────
      - name: Generate new article
        id: generate_article
        if: steps.check_published.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          CREATORS_API_CLIENT_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_API_CLIENT_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          CREATORS_API_PARTNER_TAG: ${{ secrets.CREATORS_API_PARTNER_TAG || secrets.PAAPI_PARTNER_TAG }}
          REQUIRE_POOL_VERIFICATION: 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            node scripts/generate-article.js --topic "$TOPIC" 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/generate-new-article.log"
          else
            node scripts/generate-article.js 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/generate-new-article.log"
          fi

      # ── 4. Sanitize generated articles ───────────────────────────────────────
      - name: Sanitize generated articles
        id: sanitize_articles
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          node scripts/sanitize-articles.mjs 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/sanitize-generated-articles.log"

      # ── 4b. Block unsupported first-hand or reviewer-persona claims ─────────
      - name: Validate research-based editorial claims
        id: validate_research_claims
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          node scripts/validate-research-claims.mjs 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/validate-research-claims.log"

      # ── 5. Regenerate sitemap ────────────────────────────────────────────────
      - name: Regenerate sitemap
        id: regenerate_sitemap
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          node scripts/generate-sitemap.mjs 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/regenerate-sitemap.log"

      # ── 6. SEO audit and scoped product-box quality gate ───────────────────────
      - name: Run SEO audit and quality gate for changed articles
        id: seo_audit
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          QUALITY_REPORT="$RUNNER_TEMP/weekly-content-logs/product-box-quality-report.json"
          QUALITY_ARGS=(--scoped-run --report "$QUALITY_REPORT")

          # The current run may create or update one or more articles. Those files
          # must meet the five-product minimum; unrelated legacy shortfalls remain
          # visible in the report without blocking this week's publish.
          while IFS= read -r ARTICLE; do
            [ -n "$ARTICLE" ] && QUALITY_ARGS+=(--article "$ARTICLE")
          done < <(
            {
              git diff --name-only HEAD -- 'articles/*.html'
              git ls-files --others --exclude-standard -- 'articles/*.html'
            } | sort -u
          )

          node scripts/seo-audit.mjs "${QUALITY_ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/run-seo-audit.log"

      # ── 6b. Normalize changed article chrome, then enforce the full gate ──────
      - name: Normalize and validate article chrome
        id: normalize_article_chrome
        if: steps.check_published.outputs.skip != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          {
            mapfile -t CHANGED_ARTICLES < <(
              {
                git diff --name-only HEAD -- 'articles/*.html'
                git ls-files --others --exclude-standard -- 'articles/*.html'
              } | sort -u
            )
            if [ "${#CHANGED_ARTICLES[@]}" -eq 0 ]; then
              echo "No changed article files require scoped chrome normalization."
            else
              for ARTICLE in "${CHANGED_ARTICLES[@]}"; do
                python3 scripts/normalize-article-chrome.py --only "$ARTICLE"
              done
            fi
            python3 scripts/normalize-article-chrome.py --check
          } 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/normalize-and-validate-article-chrome.log"

      # ── 7. Upload SEO audit as artifact ─────────────────────────────────────
      - name: Upload SEO audit report
        id: upload_seo_audit
        uses: actions/upload-artifact@v7
        if: always() && steps.check_published.outputs.skip != 'true'
        with:
          name: seo-audit-${{ github.run_number }}
          path: seo-audit-report.json
          retention-days: 30

      # ── 8. Commit & push (skip on dry run) ──────────────────────────────────
      - name: Commit new article and updated files
        id: commit_article
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          exec > >(tee "$RUNNER_TEMP/weekly-content-logs/commit-new-article-and-updated-files.log") 2>&1
          git config user.name  "Trail Built Bot"
          git config user.email "bot@trailbuiltoverland.com"
          git add articles/ index.html sitemap.xml seo-audit-report.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — article may already exist."
          else
            ARTICLE=$(ls -t articles/*.html | head -1 | xargs basename)
            git commit -m "chore: auto-publish ${ARTICLE} on $(date +%Y-%m-%d)"
            echo "ARTICLE_SLUG=${ARTICLE}" >> $GITHUB_ENV
          fi

      - name: Push changes to main
        id: push_changes
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/weekly-content-logs"
          git push origin main 2>&1 | tee "$RUNNER_TEMP/weekly-content-logs/push-changes-to-main.log"
          EXPECTED_SHA=$(git rev-parse HEAD)
          echo "expected_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Pushed SHA: ${EXPECTED_SHA}"

      # ── 9. Trigger Netlify deploy (optional build hook) ──────────────────────
      - name: Trigger Netlify deploy
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -s -X POST "$NETLIFY_BUILD_HOOK"
          else
            echo "No NETLIFY_BUILD_HOOK set — skipping deploy trigger."
          fi
        continue-on-error: true

      # ── 10. Verify the pushed deployment is live ─────────────────────────────
      - name: Verify auto-published deploy is live
        id: verify_deploy_live
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' && steps.push_changes.outcome == 'success' }}
        env:
          SITE_URL: https://trailbuiltoverland.com
          EXPECTED_SHA: ${{ steps.push_changes.outputs.expected_sha }}
          MAX_WAIT: 1200
          INTERVAL: 60
        run: |
          set -o pipefail
          echo "Polling ${SITE_URL}/version.txt for pushed SHA ${EXPECTED_SHA}"
          elapsed=0
          last_live_sha=""
          while [ "$elapsed" -lt "$MAX_WAIT" ]; do
            live_sha=$(curl -sf --max-time 10 "${SITE_URL}/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            last_live_sha="$live_sha"
            echo "  [${elapsed}s] live=${live_sha:-<empty>}"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Deploy confirmed live at ${elapsed}s"
              exit 0
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done
          echo "AUTO-PUBLISH DEPLOY NOT LIVE after ${MAX_WAIT}s (expected: ${EXPECTED_SHA}; last seen: ${last_live_sha:-<empty>})"
          exit 1

      - name: Open deploy timeout issue
        if: ${{ failure() && github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' && steps.verify_deploy_live.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ steps.push_changes.outputs.expected_sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = process.env.EXPECTED_SHA;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AUTO-PUBLISH DEPLOY NOT LIVE: ${sha}`,
              body: [
                '## Auto-published deploy did not become live within 20 minutes',
                '',
                `- **Pushed commit:** ${sha}`,
                `- **Workflow run:** ${runUrl}`,
                '',
                'Check the Netlify build and deploy logs for the blocking error.',
              ].join('\n'),
              labels: ['automation', 'deploy-failure'],
            });

      # ── 11. Ping search engines ──────────────────────────────────────────────
      - name: Ping search engines
        if: ${{ github.event.inputs.dry_run != 'true' && steps.check_published.outputs.skip != 'true' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/ping-search-engines.mjs
        continue-on-error: true

      # ── 12. GitHub Actions job summary ───────────────────────────────────────
      - name: Write job summary
        id: write_summary
        if: always() && steps.check_published.outputs.skip != 'true'
        run: |
          echo "## Trail Built Weekly Content Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Run date | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry run | ${{ github.event.inputs.dry_run || 'false' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Topic override | ${{ github.event.inputs.topic || '(auto)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Article count | $(ls articles/*.html | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### SEO Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f seo-audit-report.json ]; then
            ISSUES=$(python3 -c "import json; d=json.load(open('seo-audit-report.json')); print(d.get('summary', {}).get('issues', 0))" 2>/dev/null || echo "N/A")
            WARNINGS=$(python3 -c "import json; d=json.load(open('seo-audit-report.json')); print(d.get('summary', {}).get('warnings', 0))" 2>/dev/null || echo "N/A")
            CHECKS=$(python3 -c "import json; d=json.load(open('seo-audit-report.json')); print(d.get('summary', {}).get('passed', 0))" 2>/dev/null || echo "N/A")
            echo "- Issues: **${ISSUES}**" >> $GITHUB_STEP_SUMMARY
            echo "- Warnings: **${WARNINGS}**" >> $GITHUB_STEP_SUMMARY
            echo "- Checks passed: **${CHECKS}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- SEO audit report not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Product-box Quality Gate" >> $GITHUB_STEP_SUMMARY
          QUALITY_REPORT="$RUNNER_TEMP/weekly-content-logs/product-box-quality-report.json"
          if [ -f "$QUALITY_REPORT" ]; then
            python3 - "$QUALITY_REPORT" >> $GITHUB_STEP_SUMMARY <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding='utf-8'))
          results = report.get('min_product_box_results', [])
          legacy = [r for r in results if r.get('enforcement') == 'report-only' and r.get('boxes', 0) < 5]
          current = [r for r in results if r.get('enforcement') == 'blocking']
          if current:
              print('- Current-run article checks (blocking):')
              for item in current:
                  print(f"  - `{item['article']}`: {item['boxes']} product boxes")
          else:
              print('- No changed article files detected for this run.')
          if legacy:
              print('- Legacy shortfalls (report-only):')
              for item in legacy:
                  print(f"  - `{item['article']}`: {item['boxes']} product boxes")
          else:
              print('- No legacy product-box shortfalls detected.')
          PY
          else
            echo "- Product-box quality report not found" >> $GITHUB_STEP_SUMMARY
          fi

      # ── 13. Report the actual failure (only when this workflow fails) ─────────
      - name: Report actual weekly publish failure
        if: failure() && steps.check_published.outputs.skip != 'true' && steps.verify_deploy_live.outcome != 'failure'
        uses: actions/github-script@v7
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_NODE_OUTCOME: ${{ steps.setup_node.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup_python.outcome }}
          INSTALL_PYTHON_DEPENDENCIES_OUTCOME: ${{ steps.install_python_dependencies.outcome }}
          VERIFY_TOPIC_POOL_OUTCOME: ${{ steps.verify_topic_pool.outcome }}
          GENERATE_ARTICLE_OUTCOME: ${{ steps.generate_article.outcome }}
          SANITIZE_ARTICLES_OUTCOME: ${{ steps.sanitize_articles.outcome }}
          VALIDATE_RESEARCH_CLAIMS_OUTCOME: ${{ steps.validate_research_claims.outcome }}
          REGENERATE_SITEMAP_OUTCOME: ${{ steps.regenerate_sitemap.outcome }}
          SEO_AUDIT_OUTCOME: ${{ steps.seo_audit.outcome }}
          NORMALIZE_ARTICLE_CHROME_OUTCOME: ${{ steps.normalize_article_chrome.outcome }}
          UPLOAD_SEO_AUDIT_OUTCOME: ${{ steps.upload_seo_audit.outcome }}
          COMMIT_ARTICLE_OUTCOME: ${{ steps.commit_article.outcome }}
          PUSH_CHANGES_OUTCOME: ${{ steps.push_changes.outcome }}
          VERIFY_DEPLOY_LIVE_OUTCOME: ${{ steps.verify_deploy_live.outcome }}
          WRITE_SUMMARY_OUTCOME: ${{ steps.write_summary.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const candidates = [
              ['Checkout repository', process.env.CHECKOUT_OUTCOME],
              ['Set up Node.js', process.env.SETUP_NODE_OUTCOME],
              ['Set up Python', process.env.SETUP_PYTHON_OUTCOME],
              ['Install Python dependencies', process.env.INSTALL_PYTHON_DEPENDENCIES_OUTCOME, 'install-python-dependencies.log'],
              ['Verify topic pool and overwrite guard', process.env.VERIFY_TOPIC_POOL_OUTCOME, 'verify-topic-pool-and-overwrite-guard.log'],
              ['Generate new article', process.env.GENERATE_ARTICLE_OUTCOME, 'generate-new-article.log'],
              ['Sanitize generated articles', process.env.SANITIZE_ARTICLES_OUTCOME, 'sanitize-generated-articles.log'],
              ['Validate research-based editorial claims', process.env.VALIDATE_RESEARCH_CLAIMS_OUTCOME, 'validate-research-claims.log'],
              ['Regenerate sitemap', process.env.REGENERATE_SITEMAP_OUTCOME, 'regenerate-sitemap.log'],
              ['Run SEO audit and quality gate for changed articles', process.env.SEO_AUDIT_OUTCOME, 'run-seo-audit.log'],
              ['Normalize and validate article chrome', process.env.NORMALIZE_ARTICLE_CHROME_OUTCOME, 'normalize-and-validate-article-chrome.log'],
              ['Upload SEO audit report', process.env.UPLOAD_SEO_AUDIT_OUTCOME],
              ['Commit new article and updated files', process.env.COMMIT_ARTICLE_OUTCOME, 'commit-new-article-and-updated-files.log'],
              ['Push changes to main', process.env.PUSH_CHANGES_OUTCOME, 'push-changes-to-main.log'],
              ['Verify auto-published deploy is live', process.env.VERIFY_DEPLOY_LIVE_OUTCOME],
              ['Write job summary', process.env.WRITE_SUMMARY_OUTCOME],
            ];
            const failed = candidates.filter(([, outcome]) => outcome === 'failure');
            const [failingStep = 'Unclassified workflow step', , logFile] = failed[0] || [];
            let logExcerpt = 'No captured command output is available for this action-managed step. See the workflow run logs for the platform error.';
            if (logFile) {
              const logPath = path.join(process.env.RUNNER_TEMP, 'weekly-content-logs', logFile);
              if (fs.existsSync(logPath)) {
                logExcerpt = fs.readFileSync(logPath, 'utf8').slice(-12000)
                  .replace(/(Bearer\s+)[^\s]+/gi, '$1[REDACTED]');
              } else {
                logExcerpt = `Expected captured log file was not found: ${logFile}`;
              }
            }
            const allFailed = failed.length
              ? failed.map(([name]) => `- ${name}`).join('\n')
              : '- Unclassified workflow failure; inspect the run logs.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `WEEKLY PUBLISH FAILED: ${failingStep}`;
            const body = [
              '## Weekly publish failure',
              '',
              `**Actual failing step:** ${failingStep}`,
              `**Workflow run:** ${runUrl}`,
              `**Trigger:** ${context.eventName}`,
              '',
              '### Failed step(s)',
              allFailed,
              '',
              '### Relevant error output',
              '```text',
              logExcerpt,
              '```',
              '',
              'Dead-link language is reserved for a failed link-health check; this issue reports the step that actually failed.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation'],
            });
