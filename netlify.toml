# TrailBuiltOverland.com — Netlify Configuration
# Modeled on SilkierStrands.com best practices

[build]
  # ── ASIN Validation Gate ─────────────────────────────────────────────────────
  # Local deterministic checks block a deploy. Live Amazon title and catalog
  # checks report in warn mode because bot-blocking makes remote results nondeterministic.
  #
  # Required env vars (set in Netlify dashboard → Site settings → Environment):
  #   CREATORS_API_CLIENT_ID               → Amazon Creators API client ID
  #   CREATORS_API_CLIENT_SECRET           → Amazon Creators API client secret
  #   CREATORS_API_PARTNER_TAG             → affiliate tag (default: trailbuiltove-20)
  #   Credentials: https://affiliate-program.amazon.com/creatorsapi
  command = "python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt && python3 scripts/consolidate-portable-power-guides.py && python3 scripts/ensure_main_landmarks.py && node scripts/generate-sitemap.mjs && node scripts/sync-homepage-latest.js && python3 scripts/normalize-static-seo.py && node scripts/validate-editorial-images.js && python3 scripts/validate-guide-commerce.py && python3 scripts/sync-guide-catalog.py && python3 scripts/normalize-article-chrome.py --check && node scripts/validate-research-claims.mjs && if [ -n \"$CREATORS_API_CLIENT_ID\" ] && [ -n \"$CREATORS_API_CLIENT_SECRET\" ] && [ -n \"$CREATORS_API_PARTNER_TAG\" ]; then node scripts/fetch-prices.js; else echo 'Creators API credentials unavailable; browser layer will hide stale catalog data.'; fi && python3 tools/validate_asins.py && python3 tools/validate_asin_mappings.py --output /tmp/asin_mapping_report.json && python3 tools/validate_rendered_amazon_anchors.py && node scripts/validate-image-coverage.mjs --dir . && echo ${COMMIT_REF:-local} > version.txt"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  ASIN_VALIDATE = "warn"

# ── Security headers (all pages) ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options             = "DENY"
    X-XSS-Protection            = "1; mode=block"
    X-Content-Type-Options      = "nosniff"
    Referrer-Policy             = "strict-origin-when-cross-origin"
    Permissions-Policy          = "camera=(), microphone=(), geolocation=()"

# ── Cache static assets aggressively ─────────────────────────────────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/products-data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache article and category pages (1 hour, revalidate in background) ───────
[[headers]]
  for = "/articles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/categories/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# ── Cache sitemap for 1 day ───────────────────────────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Cache robots.txt for 1 week ───────────────────────────────────────────────
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Canonical domain enforcement: www → non-www (301) ────────────────────────
# Netlify handles http→https automatically via the "Force HTTPS" setting in
# the Netlify dashboard (Site settings → Domain management → HTTPS).
# This rule redirects www.trailbuiltoverland.com → trailbuiltoverland.com.
[[redirects]]
  from   = "https://www.trailbuiltoverland.com/*"
  to     = "https://trailbuiltoverland.com/:splat"
  status = 301
  force  = true

# ── Consolidated portable-power guides ───────────────────────────────────────
[[redirects]]
  from = "/articles/best-overlanding-solar-and-power.html"
  to = "/articles/best-overlanding-solar-generators-and-power-banks.html"
  status = 301
  force = true

[[redirects]]
  from = "/articles/best-overlanding-solar-and-power"
  to = "/articles/best-overlanding-solar-generators-and-power-banks.html"
  status = 301
  force = true

[[redirects]]
  from = "/articles/best-portable-power-stations-for-overlanding.html"
  to = "/articles/best-overlanding-solar-generators-and-power-banks.html"
  status = 301
  force = true

[[redirects]]
  from = "/articles/best-portable-power-stations-for-overlanding"
