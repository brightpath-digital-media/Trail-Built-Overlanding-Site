# ── Canonical article extension: extensionless → .html (sitemap form) ───────
# netlify/edge-functions/articles-html-canonical.ts runs before Pretty URLs asset
# serving and redirects only non-.html article paths, preventing redirect loops.

# ── Affiliate link redirect shortener ────────────────────────────────────────
# Clean URLs: /go/B07SJHVQTJ → Amazon product page with affiliate tag
# Usage in HTML: <a href="/go/B07SJHVQTJ">View on Amazon</a>
[[redirects]]
  from   = "/go/:asin"
  to     = "https://www.amazon.com/dp/:asin?tag=trailbuiltove-20"
  status = 302

# ── Serve sitemap.xml directly ────────────────────────────────────────────────
[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap.xml"
  status = 200
# ── Admin panel: noindex + no-cache ──────────────────────────────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
